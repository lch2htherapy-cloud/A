
name: Build Photo Studio APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp index.html www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.photostudio.mobile",
            "appName": "Photo Studio",
            "webDir": "www"
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Set Photo Studio app icon
        run: |
          python3 -m pip install --user Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Image.open("IMG-20261011-WA0031.jpg").convert("RGB")
          source = source.resize((1024, 1024), Image.Resampling.LANCZOS)

          res = Path("android/app/src/main/res")
          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = res / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png")
              icon.save(folder / "ic_launcher_round.png")

          # Remove default adaptive icons so Android uses our image.
          for folder in [res / "mipmap-anydpi", res / "mipmap-anydpi-v26"]:
              if folder.exists():
                  for filename in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                      (folder / filename).unlink(missing_ok=True)
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Photo-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
